name: tmp-generate-migration
on:
  push:
    branches: [nadavosa/1056-volunteer-owner]
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5433"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_SCHEMA: public
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: rm src/data/migrations/*-add-volunteer-owner-agent.ts
      - run: yarn test:db:up
      - run: yarn migration:run
      - run: yarn migration:generate src/data/migrations/add-volunteer-owner-agent
      - uses: actions/upload-artifact@v4
        with:
          name: migration
          path: src/data/migrations/*-add-volunteer-owner-agent.ts
