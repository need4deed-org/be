name: build-bootstrap

on:
  push:
    branches: [develop]
    paths:
      - data-bootstrap/**
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        description: Digest of the pushed bootstrap image
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Explicit repository+ref: a reusable workflow called cross-repo
      # (infra's release-prod.yaml does) checks out the CALLER's repo by
      # default, not this one - without this, docker/build-push-action
      # can't find data-bootstrap/ at all.
      - uses: actions/checkout@v4
        with:
          repository: need4deed-org/be
          ref: develop

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bootstrap image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: data-bootstrap/Dockerfile
          push: true
          tags: ghcr.io/need4deed-org/bootstrap:latest
