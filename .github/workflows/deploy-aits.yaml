name: deploy-aits

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/need4deed-org/be:develop

      - name: Publish develop digest for prod release pipeline
        # infra's release-prod.yaml reads this as ${{ vars.BE_DEVELOP_DIGEST }}
        # instead of scraping GHCR — be's own image isn't rebuilt for prod,
        # it just promotes whatever's currently on :develop.
        # continue-on-error: the dev rollout below must still run even before
        # the PAT secret this needs exists, or once it's created but expires -
        # this step failing must never take down deploy-aits's actual job.
        continue-on-error: true
        run: gh variable set BE_DEVELOP_DIGEST --org need4deed-org --repos infra --body "${{ steps.build.outputs.digest }}"
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Roll out new image on AITS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AITS_HOST }}
          username: ubuntu
          key: ${{ secrets.AITS_SSH_KEY }}
          # rollout restart alone only proves the request was accepted, not that
          # the new pod actually came up (be#868: a stuck/unschedulable pod left
          # this reporting green for ~24h while AITS kept serving the old image).
          # rollout status fails (and fails this step) if it doesn't roll out
          # within the timeout.
          script: |
            set -e
            kubectl rollout restart deployment/be -n n4d-dev
            kubectl rollout status deployment/be -n n4d-dev --timeout=120s
