name: test

# Runs the Vitest suite against a throwaway Postgres seeded only from
# checked-in fixtures (be#999) — the same `yarn test:db:*` flow as locally.
#
# The suite runs in the merge queue (merge_group), once per merge into
# develop, not on every push to a PR (be#1079). On pull_request the job is
# skipped: a skipped job reports success, so the required `test` check lets
# the PR enter the queue, where it runs for real on the queued merge commit.

on:
  pull_request:
    branches: [develop]
  # Only develop has a merge queue, so no branch filter is needed.
  merge_group:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Same compose file as local dev (not a job `services:` container) so
      # CI gets the identical Postgres flags (fsync off, max_connections).
      - name: Start test DB
        run: yarn test:db:up

      - name: Migrate and seed test DB
        run: yarn test:db:seed

      - name: Run tests
        run: yarn test:db
